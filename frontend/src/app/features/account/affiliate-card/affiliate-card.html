@if (auth.user()?.affiliateCode; as code) {
  <section class="overflow-hidden rounded-xl bg-ink text-white shadow-card">
    <div class="grid gap-6 p-5 sm:p-7 md:grid-cols-[1fr_auto] md:items-end">
      <div class="min-w-0">
        <h2 class="font-display text-lg font-bold tracking-tight text-white">{{ 'affiliate.yourCode' | transloco }}</h2>
        <p class="mt-1 max-w-md text-sm text-white/70">{{ 'affiliate.codeHint' | transloco }}</p>
        <p class="mt-5"><span dir="ltr"
          class="figure inline-block text-4xl leading-none break-all min-[360px]:text-5xl text-white select-all sm:text-6xl">#{{ code }}</span></p>
      </div>
      <div class="flex flex-wrap gap-3">
        <button type="button" (click)="copy(code)" class="btn btn-lg"
          [class]="copied() ? 'btn-success' : 'bg-white text-ink hover:-translate-y-px hover:bg-brand-soft'">
          {{ (copied() ? 'affiliate.copied' : 'affiliate.copy') | transloco }}
        </button>
      </div>
    </div>
    <p class="border-t border-white/10 bg-white/5 px-5 py-3.5 text-sm text-white/80 sm:px-7">{{ 'affiliate.nextStep' | transloco }}</p>
  </section>
}
