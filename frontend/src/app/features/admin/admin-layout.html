<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:flex lg:gap-8 lg:px-8 lg:py-8">
  <aside class="lg:w-60 lg:shrink-0">
    <div class="lg:sticky lg:top-24">
      <p class="eyebrow mb-3 hidden px-3 lg:block">{{ 'admin.title' | transloco }}</p>
      <!-- Phones and tablets: one menu instead of a long scrolling row. -->
      <label class="mb-5 block lg:hidden">
        <span class="sr-only">{{ 'admin.title' | transloco }}</span>
        <select class="field font-semibold" (change)="router.navigateByUrl($any($event.target).value)">
          @for (item of links(); track item.key) {
            <option [value]="item.link" [selected]="item.link === current()">{{ 'admin.nav.' + item.key | transloco }}</option>
          }
        </select>
      </label>
      <nav class="hidden lg:flex lg:flex-col lg:gap-1">
        @for (item of nav; track item.key) {
          @if (item.link) {
            <a [routerLink]="item.link" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: false }"
              class="nav-link whitespace-nowrap py-2">
              {{ 'admin.nav.' + item.key | transloco }}
            </a>
          } @else {
            <span class="flex items-center justify-between gap-2 whitespace-nowrap rounded-lg px-3 py-2 text-sm text-muted/70" aria-disabled="true">
              {{ 'admin.nav.' + item.key | transloco }}
              <span class="pill pill-neutral px-1.5 text-[10px] uppercase tracking-wide">{{ 'admin.soon' | transloco }}</span>
            </span>
          }
        }
      </nav>
    </div>
  </aside>
  <section class="min-w-0 flex-1 animate-fade-in">
    <router-outlet />
  </section>
</div>
