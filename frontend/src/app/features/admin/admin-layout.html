<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:flex lg:gap-10 lg:px-8 lg:py-10">
  <aside class="lg:w-56 lg:shrink-0 print:hidden">
    <div class="lg:sticky lg:top-24 lg:border-e lg:border-line lg:pe-4">
      <p class="mb-4 hidden font-display text-lg font-bold tracking-tight text-ink lg:block">{{ 'admin.title' | transloco }}</p>
      <!-- Phones and tablets: one menu instead of a long scrolling row. -->
      <label class="mb-5 block lg:hidden">
        <span class="sr-only">{{ 'admin.title' | transloco }}</span>
        <select class="field font-semibold" (change)="router.navigateByUrl($any($event.target).value)">
          @for (item of links(); track item.key) {
            <option [value]="item.link" [selected]="item.link === current()">{{ 'admin.nav.' + item.key | transloco }}</option>
          }
        </select>
      </label>
      <nav class="hidden lg:flex lg:flex-col lg:gap-0.5">
        @for (item of nav; track item.key) {
          @if (item.link) {
            <a [routerLink]="item.link" routerLinkActive="side-link-active" [routerLinkActiveOptions]="{ paths: item.link === '/admin' ? 'exact' : 'subset', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
              class="side-link">
              {{ 'admin.nav.' + item.key | transloco }}
            </a>
          } @else {
            <span class="side-link pointer-events-none text-muted/70" aria-disabled="true">
              {{ 'admin.nav.' + item.key | transloco }}
              <span class="pill pill-neutral px-1.5 text-[10px]">{{ 'admin.soon' | transloco }}</span>
            </span>
          }
        }
      </nav>
    </div>
  </aside>
  <section class="min-w-0 flex-1 animate-fade-in">
    <router-outlet />
  </section>
</div>
